[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-dropbox-bkp"
version = "2.5"
description = "Auditoria operacional de backups armazenados no Dropbox"
requires-python = ">=3.11"
dependencies = [
  "dropbox>=12.0.2,<13",
  "PyYAML>=6.0.3,<7",
  "requests>=2.32.5,<3",
  "python-dateutil>=2.9.0.post0,<3",
  "urllib3>=2.7.0,<3",
  "reportlab>=4.4.9,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["auditor_bkp*"]
